apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: docvault-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/daithang59/docvault.git
    targetRevision: gitops-testing
    path: infra/argocd-apps
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
