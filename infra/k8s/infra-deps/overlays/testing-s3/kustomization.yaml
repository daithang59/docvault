apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../testing
  - metadata-postgres-cnpg.yaml

patches:
  - patch: |-
      $patch: delete
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: minio-secret
        namespace: docvault
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: minio
        namespace: docvault
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: minio
        namespace: docvault
  - patch: |-
      $patch: delete
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: minio-init
        namespace: docvault
