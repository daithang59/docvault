# metadata-service values
namespace: docvault

image:
  repository: "harbor.docvault.id.vn/docvault-dev/metadata-service"
  tag: "v11-91993dc50756"
  digest: "sha256:8970c2f6333fd8a661fc386aaf1bd1befd7aa8883c8af5c1044314a543b58290"

healthPath: /health

service:
  type: ClusterIP
  port: 3001
env:
  NODE_ENV: production
  PORT: "3001"
  KEYCLOAK_BASE_URL: "http://keycloak:8080"
  KEYCLOAK_ISSUER: "https://auth.docvault.id.vn/realms/docvault"
  KEYCLOAK_REALM: "docvault"
  KEYCLOAK_AUDIENCE: "docvault-gateway"
  AUDIT_SERVICE_URL: "http://docvault-audit-service:3004"

envFrom:
  - secretRef:
      name: docvault-app-secrets

migration:
  enabled: true
  command: "./node_modules/.bin/prisma migrate deploy"
  backoffLimit: 3
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

seed:
  enabled: false
  nameSuffix: seed
  command: "pnpm db:seed"
  backoffLimit: 1
  ttlSecondsAfterFinished: null
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
