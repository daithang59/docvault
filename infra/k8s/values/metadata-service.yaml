# metadata-service values
namespace: docvault

image:
  repository: "harbor.docvault.id.vn/docvault-dev/metadata-service"
  tag: "9c7b7077cf48"
  digest: "sha256:6bcf276e29a96cab64f06cfe5f5aa8c25cb9ec029a58fee6fc36d9e5596e75ab"

healthPath: /health

service:
  type: ClusterIP
  port: 3001
env:
  NODE_ENV: production
  PORT: "3001"
  KEYCLOAK_BASE_URL: "http://keycloak:8080"
  KEYCLOAK_ISSUER: "https://auth.docvault.id.vn/realms/docvault"
  KEYCLOAK_REALM: "docvault"
  KEYCLOAK_AUDIENCE: "docvault-gateway"
  AUDIT_SERVICE_URL: "http://docvault-audit-service:3004"

envFrom:
  - secretRef:
      name: docvault-app-secrets

envValueFrom:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: metadata-postgres-app
        key: uri

migration:
  enabled: true
  command: "./node_modules/.bin/prisma migrate deploy"
  backoffLimit: 3
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

seed:
  enabled: false
  nameSuffix: seed
  command: "pnpm db:seed"
  backoffLimit: 1
  ttlSecondsAfterFinished: null
  resources:
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 256Mi
