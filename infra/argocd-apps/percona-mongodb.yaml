apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: percona-psmdb-operator-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    chart: psmdb-operator-crds
    repoURL: https://percona.github.io/percona-helm-charts/
    targetRevision: 1.22.0
  destination:
    server: "https://kubernetes.default.svc"
    namespace: docvault
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: percona-psmdb-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    chart: psmdb-operator
    repoURL: https://percona.github.io/percona-helm-charts/
    targetRevision: 1.22.0
    helm:
      values: |
        disableTelemetry: true
        replicaCount: 1
        watchAllNamespaces: false
        serviceAccount:
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::913355241407:role/docvault-eks-mongodb-backups
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        maxConcurrentReconciles: "1"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: docvault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: audit-mongodb-percona
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: 'https://github.com/daithang59/docvault.git'
    targetRevision: main
    path: infra/k8s/percona-audit-mongodb
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: docvault
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
