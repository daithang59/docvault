---
# Source: docvault-service/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: docvault-document-service
  namespace: "docvault"
spec:
  podSelector:
    matchLabels:
      app: docvault-document-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3002
  egress:
    - {}
---
# Source: docvault-service/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "docvault-document-service"
  namespace: "docvault"
  labels:
    app: docvault-document-service
    app.kubernetes.io/name: docvault-document-service
    app.kubernetes.io/instance: docvault-document-service
    app.kubernetes.io/component: docvault-document-service
    app.kubernetes.io/part-of: docvault-app
    app.kubernetes.io/managed-by: Helm
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::913355241407:role/docvault-eks-document-service-s3
automountServiceAccountToken: true
---
# Source: docvault-service/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: docvault-document-service
  namespace: "docvault"
  labels:
    app: docvault-document-service
    app.kubernetes.io/name: docvault-document-service
    app.kubernetes.io/instance: docvault-document-service
    app.kubernetes.io/component: docvault-document-service
    app.kubernetes.io/part-of: docvault-app
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  ports:
    - port: 3002
      targetPort: 3002
      protocol: TCP
      name: http
  selector:
    app: docvault-document-service
---
# Source: docvault-service/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docvault-document-service
  namespace: "docvault"
  labels:
    app: docvault-document-service
    app.kubernetes.io/name: docvault-document-service
    app.kubernetes.io/instance: docvault-document-service
    app.kubernetes.io/component: docvault-document-service
    app.kubernetes.io/part-of: docvault-app
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docvault-document-service
  template:
    metadata:
      labels:
        app: docvault-document-service
        app.kubernetes.io/name: docvault-document-service
        app.kubernetes.io/instance: docvault-document-service
        app.kubernetes.io/component: docvault-document-service
        app.kubernetes.io/part-of: docvault-app
    spec:
      serviceAccountName: "docvault-document-service"
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: harbor-docvault-dev-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: docvault-document-service
          image: "harbor.docvault.id.vn/docvault-dev/document-service:v33@sha256:629f1a89327f04197b4f01a0a10576e4cc495d99e59c1f12b4824dffed9044ee"
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3002
          livenessProbe:
            httpGet:
              path: "/health"
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: "/health"
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            limits:
              cpu: 300m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          env:
            - name: AUDIT_SERVICE_URL
              value: "http://docvault-audit-service:3004"
            - name: KEYCLOAK_AUDIENCE
              value: "docvault-gateway"
            - name: KEYCLOAK_BASE_URL
              value: "http://keycloak:8080"
            - name: KEYCLOAK_ISSUER
              value: "https://auth.docvault.id.vn/realms/docvault"
            - name: KEYCLOAK_REALM
              value: "docvault"
            - name: METADATA_SERVICE_URL
              value: "http://docvault-metadata:3001"
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3002"
            - name: S3_BUCKET
              value: "docvault-documents-testing-913355241407"
            - name: S3_BUCKET_KEY_ENABLED
              value: "true"
            - name: S3_ENDPOINT
              value: ""
            - name: S3_FORCE_PATH_STYLE
              value: "false"
            - name: S3_KMS_KEY_ID
              value: "arn:aws:kms:ap-southeast-1:913355241407:key/f55ab524-e841-4215-b81b-0e43c24f1f68"
            - name: S3_REGION
              value: "ap-southeast-1"
            - name: S3_SERVER_SIDE_ENCRYPTION
              value: "aws:kms"
            - name: S3_USE_STATIC_CREDENTIALS
              value: "false"
          envFrom:
            - secretRef:
                name: docvault-app-secrets
      volumes:
        - name: tmp
          emptyDir: {}
