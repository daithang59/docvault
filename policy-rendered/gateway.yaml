---
# Source: docvault-service/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: docvault-gateway
  namespace: "docvault"
spec:
  podSelector:
    matchLabels:
      app: docvault-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - {}
---
# Source: docvault-service/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: docvault-gateway
  namespace: "docvault"
  labels:
    app: docvault-gateway
    app.kubernetes.io/name: docvault-gateway
    app.kubernetes.io/instance: docvault-gateway
    app.kubernetes.io/component: docvault-gateway
    app.kubernetes.io/part-of: docvault-app
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: docvault-gateway
---
# Source: docvault-service/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docvault-gateway
  namespace: "docvault"
  labels:
    app: docvault-gateway
    app.kubernetes.io/name: docvault-gateway
    app.kubernetes.io/instance: docvault-gateway
    app.kubernetes.io/component: docvault-gateway
    app.kubernetes.io/part-of: docvault-app
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docvault-gateway
  template:
    metadata:
      labels:
        app: docvault-gateway
        app.kubernetes.io/name: docvault-gateway
        app.kubernetes.io/instance: docvault-gateway
        app.kubernetes.io/component: docvault-gateway
        app.kubernetes.io/part-of: docvault-app
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-docvault-dev-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: docvault-gateway
          image: "harbor.docvault.id.vn/docvault-dev/gateway:v9-ad76f1e1bd85@sha256:0d933a0cb7362897e8fca80d56a15bf3bef1182bc46821a6cd03cc2cb5384cbe"
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: "/api/health"
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: "/api/health"
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            limits:
              cpu: 300m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          env:
            - name: ALLOWED_ORIGINS
              value: "https://app.docvault.id.vn"
            - name: AUDIT_SERVICE_URL
              value: "http://docvault-audit-service:3004"
            - name: DOCUMENT_SERVICE_URL
              value: "http://docvault-document-service:3002"
            - name: FRONTEND_URL
              value: "https://app.docvault.id.vn"
            - name: GATEWAY_URL
              value: "http://docvault-gateway:3000"
            - name: KEYCLOAK_AUDIENCE
              value: "docvault-gateway"
            - name: KEYCLOAK_BASE_URL
              value: "http://keycloak:8080"
            - name: KEYCLOAK_CLIENT_ID
              value: "docvault-gateway"
            - name: KEYCLOAK_ISSUER
              value: "https://auth.docvault.id.vn/realms/docvault"
            - name: KEYCLOAK_REALM
              value: "docvault"
            - name: METADATA_SERVICE_URL
              value: "http://docvault-metadata:3001"
            - name: NODE_ENV
              value: "production"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://docvault-notification-service:3005"
            - name: PORT
              value: "3000"
            - name: WORKFLOW_SERVICE_URL
              value: "http://docvault-workflow-service:3003"
          envFrom:
            - secretRef:
                name: docvault-app-secrets
      volumes:
        - name: tmp
          emptyDir: {}
