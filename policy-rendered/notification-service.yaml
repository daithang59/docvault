---
# Source: docvault-service/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: docvault-notification-service
  namespace: "docvault"
spec:
  podSelector:
    matchLabels:
      app: docvault-notification-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3005
  egress:
    - {}
---
# Source: docvault-service/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: docvault-notification-service
  namespace: "docvault"
  labels:
    app: docvault-notification-service
    app.kubernetes.io/name: docvault-notification-service
    app.kubernetes.io/instance: docvault-notification-service
    app.kubernetes.io/component: docvault-notification-service
    app.kubernetes.io/part-of: docvault-app
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  ports:
    - port: 3005
      targetPort: 3005
      protocol: TCP
      name: http
  selector:
    app: docvault-notification-service
---
# Source: docvault-service/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docvault-notification-service
  namespace: "docvault"
  labels:
    app: docvault-notification-service
    app.kubernetes.io/name: docvault-notification-service
    app.kubernetes.io/instance: docvault-notification-service
    app.kubernetes.io/component: docvault-notification-service
    app.kubernetes.io/part-of: docvault-app
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docvault-notification-service
  template:
    metadata:
      labels:
        app: docvault-notification-service
        app.kubernetes.io/name: docvault-notification-service
        app.kubernetes.io/instance: docvault-notification-service
        app.kubernetes.io/component: docvault-notification-service
        app.kubernetes.io/part-of: docvault-app
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-docvault-dev-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: docvault-notification-service
          image: "harbor.docvault.id.vn/docvault-dev/notification-service:v9-ad76f1e1bd85@sha256:2767bc6cd6d68766e5193278b41e4deb01620331ce9d3f510e01b3e2a4017d35"
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3005
          livenessProbe:
            httpGet:
              path: "/health"
              port: 3005
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: "/health"
              port: 3005
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          env:
            - name: AUDIT_SERVICE_URL
              value: "http://docvault-audit-service:3004"
            - name: KEYCLOAK_AUDIENCE
              value: "docvault-gateway"
            - name: KEYCLOAK_BASE_URL
              value: "http://keycloak:8080"
            - name: KEYCLOAK_ISSUER
              value: "https://auth.docvault.id.vn/realms/docvault"
            - name: KEYCLOAK_REALM
              value: "docvault"
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3005"
          envFrom:
            - secretRef:
                name: docvault-app-secrets
      volumes:
        - name: tmp
          emptyDir: {}
