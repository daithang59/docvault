---
# Source: docvault-service/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: docvault-web
  namespace: "docvault"
spec:
  podSelector:
    matchLabels:
      app: docvault-web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3006
  egress:
    - {}
---
# Source: docvault-service/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: docvault-web
  namespace: "docvault"
  labels:
    app: docvault-web
    app.kubernetes.io/name: docvault-web
    app.kubernetes.io/instance: docvault-web
    app.kubernetes.io/component: docvault-web
    app.kubernetes.io/part-of: docvault-app
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  ports:
    - port: 3006
      targetPort: 3006
      protocol: TCP
      name: http
  selector:
    app: docvault-web
---
# Source: docvault-service/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docvault-web
  namespace: "docvault"
  labels:
    app: docvault-web
    app.kubernetes.io/name: docvault-web
    app.kubernetes.io/instance: docvault-web
    app.kubernetes.io/component: docvault-web
    app.kubernetes.io/part-of: docvault-app
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docvault-web
  template:
    metadata:
      labels:
        app: docvault-web
        app.kubernetes.io/name: docvault-web
        app.kubernetes.io/instance: docvault-web
        app.kubernetes.io/component: docvault-web
        app.kubernetes.io/part-of: docvault-app
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-docvault-dev-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: docvault-web
          image: "harbor.docvault.id.vn/docvault-dev/docvault:v8-2019b9dcef2e@sha256:eaee67d14cb348e5ca3089ad14d24b75351dce36d2e7944db17cf3b3ad8e4672"
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3006
          livenessProbe:
            httpGet:
              path: "/api/health"
              port: 3006
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: "/api/health"
              port: 3006
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          env:
            - name: FRONTEND_URL
              value: "https://app.docvault.id.vn"
            - name: GATEWAY_URL
              value: "http://docvault-gateway:3000"
            - name: KEYCLOAK_BROWSER_BASE_URL
              value: "https://auth.docvault.id.vn"
            - name: KEYCLOAK_CLIENT_ID
              value: "docvault-gateway"
            - name: KEYCLOAK_INTERNAL_BASE_URL
              value: "http://keycloak:8080"
            - name: KEYCLOAK_REALM
              value: "docvault"
            - name: NEXT_PUBLIC_API_BASE_URL
              value: "/api"
            - name: NEXT_PUBLIC_APP_NAME
              value: "DocVault"
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3006"
      volumes:
        - name: tmp
          emptyDir: {}
