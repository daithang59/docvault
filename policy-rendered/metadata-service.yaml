        - name: harbor-docvault-dev-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: "harbor.docvault.id.vn/docvault-dev/metadata-service:v9-ad76f1e1bd85@sha256:751d127036d5a5a3dd28149a1759ced981da45b9ed6360962fa0323761f3a2fa"
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - "./node_modules/.bin/prisma migrate deploy"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          env:
