      protocol: TCP
      name: http
  selector:
    app: docvault-metadata-service
---
# Source: docvault-service/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docvault-metadata-service
  namespace: "docvault"
  labels:
    app: docvault-metadata-service
    app.kubernetes.io/name: docvault-metadata-service
    app.kubernetes.io/instance: docvault-metadata-service
    app.kubernetes.io/component: docvault-metadata-service
    app.kubernetes.io/part-of: docvault-app
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docvault-metadata-service
  template:
    metadata:
      labels:
        app: docvault-metadata-service
        app.kubernetes.io/name: docvault-metadata-service
        app.kubernetes.io/instance: docvault-metadata-service
        app.kubernetes.io/component: docvault-metadata-service
        app.kubernetes.io/part-of: docvault-app
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-docvault-dev-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: docvault-metadata-service
          image: "harbor.docvault.id.vn/docvault-dev/metadata-service:v9-ad76f1e1bd85@sha256:751d127036d5a5a3dd28149a1759ced981da45b9ed6360962fa0323761f3a2fa"
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3001
          livenessProbe:
            httpGet:
              path: "/health"
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: "/health"
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          env:
            - name: AUDIT_SERVICE_URL
              value: "http://docvault-audit-service:3004"
            - name: KEYCLOAK_AUDIENCE
              value: "docvault-gateway"
            - name: KEYCLOAK_BASE_URL
              value: "http://keycloak:8080"
            - name: KEYCLOAK_ISSUER
              value: "https://auth.docvault.id.vn/realms/docvault"
            - name: KEYCLOAK_REALM
              value: "docvault"
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3001"
          envFrom:
            - secretRef:
                name: docvault-app-secrets
      volumes:
        - name: tmp
          emptyDir: {}
---
# Source: docvault-service/templates/migration-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: docvault-metadata-service-migrate
