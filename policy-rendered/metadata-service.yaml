---
# Source: docvault-service/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: docvault-metadata-service
  namespace: "docvault"
spec:
  podSelector:
    matchLabels:
      app: docvault-metadata-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3001
  egress:
    - {}
---
# Source: docvault-service/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: docvault-metadata-service
  namespace: "docvault"
  labels:
    app: docvault-metadata-service
    app.kubernetes.io/name: docvault-metadata-service
    app.kubernetes.io/instance: docvault-metadata-service
    app.kubernetes.io/component: docvault-metadata-service
    app.kubernetes.io/part-of: docvault-app
    app.kubernetes.io/managed-by: Helm
spec:
