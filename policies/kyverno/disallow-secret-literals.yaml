apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-secret-literals
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: no-secret-data-in-gitops-manifests
      match:
        any:
          - resources:
              kinds:
                - Secret
      validate:
        message: "Do not commit Kubernetes Secret data/stringData in GitOps manifests; use ExternalSecrets or another encrypted secret workflow."
        pattern:
          =(data): null
          =(stringData): null
