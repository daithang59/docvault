apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-docvault-image-pull-secret
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: deployment-requires-harbor-pull-secret
      match:
        any:
          - resources:
              kinds:
                - Deployment
              selector:
                matchLabels:
                  app.kubernetes.io/part-of: docvault-app
      validate:
        message: "DocVault application Deployments must reference the Harbor image pull secret."
        pattern:
          spec:
            template:
              spec:
                imagePullSecrets:
                  - name: "harbor-docvault-*-pull"
    - name: job-requires-harbor-pull-secret
      match:
        any:
          - resources:
              kinds:
                - Job
              selector:
                matchLabels:
                  app.kubernetes.io/part-of: docvault-app
      validate:
        message: "DocVault application Jobs must reference the Harbor image pull secret."
        pattern:
          spec:
            template:
              spec:
                imagePullSecrets:
                  - name: "harbor-docvault-*-pull"
